    <path d="M230 396V476"/>
    <path d="M230 520V540"/>
    <path d="M230 584V604"/>
    <path d="M395 334H590V540"/>
    <!-- loops on 5 and 6 -->
    <path d="M375 300C395 300 395 320 375 320"/>
    <path d="M375 364C395 364 395 384 375 384"/>
  </g>

  <!-- back -->
  <g stroke="#c0392b" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#back)">
